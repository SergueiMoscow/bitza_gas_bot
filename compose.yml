services:
  gas-bot:
    build: .
    container_name: gas_bot
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./.env:/app/.env

    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_USER_ID=${ADMIN_USER_ID}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      - WEB_APP_DOMAIN=${WEB_APP_DOMAIN}

    restart: unless-stopped

  gas-app:
    build: .
    container_name: gas_web_app
    command: python src/web_app.py
    ports:
      - "5000:5000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - WEB_APP_DOMAIN=${WEB_APP_DOMAIN}
    restart: unless-stopped